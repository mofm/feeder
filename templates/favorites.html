{% extends 'base.html' %}
{% block content %}
    {% load static %}
    <main class="container flex-grow-1 py-4">
        <div class="row">
            <div class="col">
                <ul class="list-group">
                    {% for feed in page_obj %}
                        <li class="list-group-item d-flex justify-content-between align-items-center" data-feed-id="{{ feed.pk }}">
                            <div class="text-truncate feed-title">
                                <a href="{{ feed.link }}" class="text-primary text-truncate" target="_blank">{{ feed.title }}</a>
                                <small class="text-muted d-block">{{ feed.pub_date | date:"d/m/Y" }}</small>
                                <span class="badge badge-secondary">{{ feed.category }}</span>
                            </div>
                            <div class="btn-group">
                                <button class="btn bg-transparent btn-sm btn-favorite favorited" data-action="remove">
                                    <i class="fas fa-heart"></i>
                                </button>
                                <button class="btn btn-secondary btn-sm share-button" data-url="{{ feed.link }}">
                                    <i class="fas fa-share"></i>
                                </button>
                            </div>
                        </li>
                    {% empty %}
                        <li class="list-group-item text-center">
                            <h3>No results found. Try again.</h3>
                        </li>
                    {% endfor %}
                </ul>
                {% include "_items/pagination.html" %}
            </div>
        </div>
    </main>
{% endblock %}
